name: Expand Eldoria Chronicles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand the campaign and shop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('eldoria_chronicles.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def _visit_merchant(player):')
          end = text.index('\n# ─────────────────────────────────────────────\n#  SHOP BETWEEN ACTS', start)

          shop = r'''def _visit_merchant(player):
              divider()
              slow_type("THE MERCHANT'S CARAVAN")
              slow_type("A weather-beaten caravan has arrived beneath a canvas awning of deep blue.")
              slow_type("Copper lanterns sway overhead while shelves creak under the weight of useful curios.")
              slow_type(f"\n  The merchant studies you. \"Gold talks, traveller. But knowing what to buy talks louder.\"")

              goods = [
                  ("Health Potion", 8, "A bitter crimson tonic brewed from moonroot. Restores up to 50 HP when consumed."),
                  ("Ether Vial", 10, "A glass vial of shimmering blue essence. Restores up to 40 MP and smells faintly of rain."),
                  ("Smoke Bomb", 6, "A palm-sized cloudmaker packed with harmless alchemical powder. Lets you escape from a battle."),
                  ("Elixir of Fortitude", 25, "A rare golden draught. Drinking it completely restores HP and MP."),
                  ("Iron Charm", 15, "A heavy charm stamped with the old Ironpeak crest. Permanently increases Defence by 3."),
                  ("War Sigil", 18, "An ancient mark of courage etched onto a small stone. Permanently increases Attack by 4."),
                  ("Arcane Crystal", 20, "A humming fragment of crystallised mana. Permanently increases Magic by 5."),
                  ("Traveller's Rations", 5, "Dried fruit, hard bread and spiced roots. A cheap meal that restores 20 HP."),
                  ("Moonleaf Tea", 7, "A fragrant tea made from silver-green leaves. Restores 20 MP and clears exhaustion."),
                  ("Explorer's Map", 12, "A hand-drawn map covered in notes about roads, ruins and forgotten shortcuts. Grants 30 XP when studied."),
                  ("Lucky Coin", 16, "An old coin with a smiling king on one side. Carrying it gives you a small chance to find extra gold after combat."),
                  ("Void Tome", 20, "A sealed scholarly volume about the Void. Selling it is profitable; keeping it reveals unsettling lore."),
                  ("Starlight Lantern", 22, "A crystal lantern that glows without flame. It reveals hidden writing and grants +2 Magic permanently."),
                  ("Guardian's Token", 24, "A polished token carried by ancient wardens. It grants +2 Defence and restores 15 HP immediately."),
                  ("Phoenix Feather", 30, "A warm feather that never burns. Once purchased, it can prevent one defeat and leave you at 1 HP."),
                  ("Merchant's Mystery Box", 14, "A sealed wooden box. The merchant refuses to say what is inside. Its contents are randomly selected."),
              ]

              while True:
                  options = [f"{name} — {price}g" for name, price, _ in goods]
                  options += ["Ask the merchant for advice", "Sell a found item", "Leave the caravan"]
                  choice = get_choice(f"\nGold: {player.gold}\nWhat catches your eye?", options)

                  if choice == len(options):
                      slow_type("  The merchant tips his hat. \"Safe roads, Shard-bearer.\"")
                      return

                  if choice == len(options) - 1:
                      sellable = [i for i in player.inventory if i in {
                          "Void Tome", "Health Potion", "Ether Vial", "Smoke Bomb",
                          "Mega Potion", "Arcane Brew", "Void Flask", "Shadow Oil"
                      }]
                      if not sellable:
                          slow_type("  You have nothing the merchant wants to buy right now.")
                          continue
                      sell_options = [f"{item} — sell for {max(2, len(item))}g" for item in sellable] + ["Cancel"]
                      sell_choice = get_choice("\nWhat will you sell?", sell_options)
                      if sell_choice == len(sell_options):
                          continue
                      item = sellable[sell_choice - 1]
                      value = max(2, len(item))
                      player.inventory.remove(item)
                      player.gold += value
                      slow_type(f"  Sold {item} for {value}g. You now have {player.gold}g.")
                      continue

                  if choice == len(options) - 2:
                      advice = random.choice([
                          "Potions are boring until the exact moment you desperately need one.",
                          "If your gold is piling up, permanent upgrades are usually worth more than another trinket.",
                          "The roads east of Ironpeak have more ruins than maps admit.",
                          "Some merchants sell things they don't understand. Keep an eye on strange books and crystals.",
                          "The best treasure in Eldoria is usually hidden behind a choice, not a locked chest.",
                      ])
                      slow_type(f"  [Merchant]: \"{advice}\"")
                      continue

                  name, price, desc = goods[choice - 1]
                  divider()
                  slow_type(name.upper())
                  slow_type(f"  Price: {price} gold")
                  slow_type(f"  Description: {desc}")
                  buy = get_choice("Buy this item?", ["Yes", "No, keep browsing"])
                  if buy != 1:
                      continue
                  if player.gold < price:
                      slow_type("  You count your coins twice. Not enough gold.")
                      continue

                  player.gold -= price
                  if name == "Iron Charm":
                      player.defence += 3
                      slow_type("  The charm warms in your palm. Defence permanently increased by 3.")
                  elif name == "War Sigil":
                      player.attack += 4
                      player.base_attack = player.attack
                      slow_type("  The sigil settles into your gear. Attack permanently increased by 4.")
                  elif name == "Arcane Crystal":
                      player.magic += 5
                      slow_type("  The crystal dissolves into sparks. Magic permanently increased by 5.")
                  elif name == "Starlight Lantern":
                      player.magic += 2
                      player.inventory.append(name)
                      slow_type("  The lantern reveals hidden patterns in the air. Magic +2 permanently.")
                  elif name == "Guardian's Token":
                      player.defence += 2
                      healed = player.heal(15)
                      player.inventory.append(name)
                      slow_type(f"  The token settles against your chest. Defence +2 and +{healed} HP.")
                  elif name == "Traveller's Rations":
                      healed = player.heal(20)
                      slow_type(f"  You eat beside the caravan fire. +{healed} HP.")
                  elif name == "Moonleaf Tea":
                      gain = min(20, player.max_mp - player.mp)
                      player.mp += gain
                      slow_type(f"  The tea clears your thoughts. +{gain} MP.")
                  elif name == "Explorer's Map":
                      player.gain_xp(30)
                      player.inventory.append(name)
                      slow_type("  You study the map and memorise its safest routes. +30 XP.")
                  elif name == "Lucky Coin":
                      player.inventory.append(name)
                      slow_type("  The old coin feels strangely warm. It may reward you after future victories.")
                  elif name == "Phoenix Feather":
                      player.inventory.append(name)
                      slow_type("  The feather glows once, as if acknowledging your purchase.")
                  elif name == "Merchant's Mystery Box":
                      result = random.choice([
                          "Health Potion", "Ether Vial", "Smoke Bomb", "Moonleaf Tea",
                          "Lucky Coin", "Guardian's Token", "20 gold"
                      ])
                      if result == "20 gold":
                          player.gold += 20
                          slow_type("  The box contains a hidden purse: +20 gold!")
                      else:
                          player.inventory.append(result)
                          slow_type(f"  Inside the box: {result}!")
                  else:
                      player.inventory.append(name)
                      slow_type(f"  Purchased {name}.")

                  if len(player.inventory) >= 6:
                      unlock_achievement(player, "hoarder")


'''

          text = text[:start] + shop + text[end:]

          marker = '# ─────────────────────────────────────────────\n#  SIDE QUESTS (8 total)'
          insert_at = text.index(marker)

          extra = r'''# ─────────────────────────────────────────────
#  THE LONG ROAD — EXTENDED CHRONICLES
# ─────────────────────────────────────────────

EXTENDED_QUESTS = {
    "greenhollow": [
        ("The Bell Beneath the Roots", "A bell buried beneath an ancient tree rings whenever the Void draws near."),
        ("Letters Never Sent", "A ruined post office contains hundreds of letters written before the Shard Wars."),
        ("The Orchard Keeper", "An old gardener refuses to abandon an orchard growing impossible silver fruit."),
    ],
    "ironpeak": [
        ("The Empty Foundry", "A silent foundry still produces glowing tools despite having no workers."),
        ("Echoes in the Lift", "An abandoned mine lift descends farther than any surviving map records."),
        ("The Last Apprentice", "A young craftsperson needs help deciding whether to rebuild or leave Ironpeak."),
    ],
    "arcane_spire": [
        ("The Library That Moved", "Every time you enter the library, the shelves have rearranged themselves."),
        ("Seven Questions", "A magical door asks questions whose answers change the path behind it."),
        ("The Sleeping Constellation", "A constellation has vanished from the sky and something is trying to replace it."),
    ],
    "duskmar": [
        ("Lanterns for the Lost", "Duskmar's streets are full of abandoned lanterns that still remember their owners."),
        ("The Silent Theatre", "A theatre performs every night even though no audience can remember buying tickets."),
        ("A Name in Ash", "A single name appears on walls throughout the city, always one street ahead of you."),
    ],
    "voidfrontier": [
        ("The Door With No Wall", "A doorway stands alone in a field and opens onto somewhere that should not exist."),
        ("The Hourglass Lake", "The lake reflects yesterday instead of today."),
        ("The Fifth Road", "Four roads are marked on the map. A fifth appears only when you stop looking for it."),
    ],
}


def _extended_reward(player, kind):
    if kind == "greenhollow":
        player.gain_xp(45)
        player.reputation += 1
    elif kind == "ironpeak":
        player.gain_xp(55)
        player.defence += 2
    elif kind == "arcane_spire":
        player.gain_xp(60)
        player.magic += 3
    elif kind == "duskmar":
        player.gain_xp(65)
        player.reputation += 2
    else:
        player.gain_xp(80)
        player.max_mp += 5
        player.mp = player.max_mp


def extended_chronicle(player, region):
    """Adds a long optional chapter after each main act without replacing the original story."""
    divider()
    titles = {
        "act_one": ("THE LONG ROAD: GREENHOLLOW", "The village is safe for tonight, but the roads beyond it are not."),
        "act_two": ("THE LONG ROAD: IRONPEAK", "The mountain remembers every traveller who ever climbed it."),
        "act_three": ("THE LONG ROAD: ARCANE SPIRE", "The Spire's scholars know more than they are willing to say."),
        "act_four": ("THE LONG ROAD: DUSKMAR", "The city prepares for a festival while the sky quietly darkens."),
        "act_five": ("THE LONG ROAD: THE VOID FRONTIER", "The final road is not on any map. You walk it anyway."),
    }
    key = {
        "act_one": "greenhollow", "act_two": "ironpeak", "act_three": "arcane_spire",
        "act_four": "duskmar", "act_five": "voidfrontier",
    }.get(region, "greenhollow")
    title, intro = titles.get(region, ("THE LONG ROAD", "Another road waits."))
    slow_type(title)
    slow_type(intro)
    slow_type("  Three smaller stories unfold here. You can follow all of them, or leave some mysteries unsolved.")

    quests = EXTENDED_QUESTS[key]
    for index, (quest_name, premise) in enumerate(quests, 1):
        divider()
        slow_type(f"CHAPTER {index}: {quest_name}")
        slow_type(f"  {premise}")

        if index == 1:
            choice = get_choice("How do you approach the mystery?", [
                "Investigate carefully",
                "Ask the locals what they know",
                "Follow the strange signal immediately",
            ])
            if choice == 1:
                slow_type("  You spend time examining footprints, old marks and half-erased clues.")
                player.gain_xp(20)
                slow_type("  Careful observation reveals a safer route. +20 XP.")
            elif choice == 2:
                slow_type("  Stories contradict each other, but one detail keeps appearing: a silver lantern.")
                player.reputation += 1
                slow_type("  The locals appreciate your patience. Reputation +1.")
            else:
                slow_type("  You follow the signal and discover it was bait for a forgotten guardian.")
                enemy = Enemy("Forgotten Guardian", hp=70 + player.level * 4, attack=14 + player.level, defence=5,
                              xp_reward=45, gold_drop=12,
                              lore="A construct left behind when the old kingdoms still feared the Void.",
                              abilities=["shield"])
                result = combat(player, enemy)
                if result == "lose":
                    return "lose"

        elif index == 2:
            choice = get_choice("A difficult choice appears.", [
                "Preserve the old secret",
                "Reveal it to everyone",
                "Use it for your own advantage",
            ])
            if choice == 1:
                player.reputation += 2
                player.gain_xp(35)
                slow_type("  You protect a secret that could have caused panic. Reputation +2, +35 XP.")
            elif choice == 2:
                player.reputation += 1
                player.gain_xp(45)
                slow_type("  The truth spreads. Some people thank you; others are frightened. +45 XP.")
            else:
                player.reputation -= 2
                player.gain_gold(18)
                slow_type("  You profit from the discovery. +18 gold, Reputation -2.")

        else:
            choice = get_choice("The final mystery waits.", [
                "Help the people involved",
                "Take the treasure and leave",
                "Stay and uncover the entire story",
            ])
            if choice == 1:
                player.reputation += 2
                player.inventory.append(random.choice(["Health Potion", "Ether Vial", "Moonleaf Tea"]))
                slow_type("  Your help is remembered. Reputation +2 and a useful item is given to you.")
            elif choice == 2:
                player.reputation -= 1
                player.gain_gold(25)
                slow_type("  You leave richer, but the unanswered question follows you.")
            else:
                player.gain_xp(70)
                slow_type("  You stay until dawn and piece together the complete history.")
                slow_type("  The truth is stranger than the rumours. +70 XP.")

        _extended_reward(player, key)
        player.quests_completed += 1
        slow_type(f"  [Chapter complete. Total quests: {player.quests_completed}]")
        if player.quests_completed >= 4:
            unlock_achievement(player, "all_quests")
        if player.level >= 10:
            unlock_achievement(player, "max_level")

    slow_type("\n  The road ahead remains dangerous, but Eldoria feels larger now — and so do you.")
    save_game(player, f"{region}_extended")
    return None

'''

          text = text[:insert_at] + extra + text[insert_at:]

          old = '''            state = act_map[act_key](player)\n            if state == "lose" or not player.is_alive():\n'''
          new = '''            state = act_map[act_key](player)\n            if state not in ("lose",) and player.is_alive():\n                extra_state = extended_chronicle(player, act_key)\n                if extra_state == "lose":\n                    state = "lose"\n            if state == "lose" or not player.is_alive():\n'''
          if old not in text:
              raise SystemExit('Could not find main act loop marker')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          r = readme_path.read_text(encoding='utf-8')
          if '## Expanded Long-Road Campaign' not in r:
              additions = '''\n## Expanded Long-Road Campaign\n\nThe game now includes an additional **15 optional story chapters** spread across Greenhollow, Ironpeak, the Arcane Spire, Duskmar and the Void Frontier. These chapters add exploration, choices, rewards, extra combat encounters, lore, reputation changes and additional save checkpoints.\n\n### Shop overhaul\n\nThe travelling merchant now gives every item a proper description before you buy it. The caravan has expanded stock including healing supplies, magical curios, permanent stat upgrades, maps, lanterns, tokens, mystery boxes and other exploration items. You can also ask the merchant for advice or sell selected found items.\n\nThe original five-act story and endings remain intact; the extended chapters are woven between the acts so a normal playthrough is substantially longer.\n'''
              readme_path.write_text(r.rstrip() + '\n' + additions, encoding='utf-8')
          PY

      - name: Commit expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eldoria_chronicles.py README.md
          git commit -m "Expand Eldoria campaign and shop descriptions" || exit 0
          git push
